# =============================================================================
# Phantom World — targeting (ox_target ONLY, no qb-target UI)
# =============================================================================
# Exec from server.cfg after `ensure ox_lib` (early) and again near the end (late
# stops if txAdmin or another cfg restarts qb-target).
#
# - ox_target     = Overextended third eye (default: hold Left Alt / LMENU)
# - ox_compat     = old scripts calling exports['qb-target'] → ox_target (no QB eye)
# - qb-target     = ox_compat provides this name (real UI is ox_target)
# - interact_duplicate = STOPPED (duplicate interaction sprites)
# =============================================================================

################
### Convars  ###
################

# Legacy QB scripts: false = prefer draw-text where supported (does not start qb-target).
setr UseTarget false

# ox_inventory shops/stashes use ox_target zones.
setr inventory:target true

####################
### Resources    ###
### (early pass) ###
####################

ensure ox_target
ensure ox_compat
stop qb-target-legacy
# ox_compat provides `qb-target` — legacy scripts keep calling exports['qb-target']
ensure qb-target
stop interact_duplicate

###################
### Late stops  ###
### (re-exec)   ###
###################

stop qb-target-legacy
ensure qb-target
stop interact_duplicate
