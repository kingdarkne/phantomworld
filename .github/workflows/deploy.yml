name: Deploy to FiveM host

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      full_sync:
        description: Upload entire server (slow, ~40 min)
        type: boolean
        default: false
      paths:
        description: Comma-separated files or folders (e.g. resources/[custom]/my-script,server.cfg)
        required: false
        type: string

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
          submodules: false

      - name: Prepare deploy bundle
        env:
          DISPATCH_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_sync }}
          DISPATCH_PATHS: ${{ github.event_name == 'workflow_dispatch' && inputs.paths || '' }}
        run: |
          set -euo pipefail
          BUNDLE_DIR="$(mktemp -d)"
          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"

          copy_path() {
            local target="$1"
            if [ -f "$target" ]; then
              mkdir -p "$BUNDLE_DIR/$(dirname "$target")"
              cp "$target" "$BUNDLE_DIR/$target"
              echo "  + $target"
            elif [ -d "$target" ]; then
              mkdir -p "$BUNDLE_DIR/$(dirname "$target")"
              rsync -av --exclude-from=.deploy-exclude "$target/" "$BUNDLE_DIR/$target/"
              echo "  + $target/"
            else
              echo "  ! skipped (missing): $target"
            fi
          }

          add_changed_file() {
            local file="$1"
            case "$file" in
              .github/*|.deploy-exclude|.gitignore|DEPLOY.md|GITHUB-SETUP.md)
                return 0
                ;;
            esac
            case "$file" in
              resources/*/*/*)
                DEPLOY_ROOTS["$(echo "$file" | cut -d/ -f1-3)"]=1
                ;;
              resources/*/*)
                DEPLOY_ROOTS["$(echo "$file" | cut -d/ -f1-2)"]=1
                ;;
              *)
                DEPLOY_ROOTS["__file__:$file"]=1
                ;;
            esac
          }

          if [ "${DISPATCH_FULL:-false}" = "true" ]; then
            echo "Deploy mode: full server sync (manual)"
            echo "DEPLOY_MODE=full" >> "$GITHUB_ENV"
            rsync -av --exclude-from=.deploy-exclude ./ "$BUNDLE_DIR"/
            exit 0
          fi

          if [ -n "${DISPATCH_PATHS:-}" ]; then
            echo "Deploy mode: manual paths"
            echo "DEPLOY_MODE=scoped" >> "$GITHUB_ENV"
            IFS=',' read -ra MANUAL <<< "${DISPATCH_PATHS}"
            for raw in "${MANUAL[@]}"; do
              path="$(echo "$raw" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
              [ -z "$path" ] && continue
              copy_path "$path"
            done
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          SHA="${{ github.sha }}"
          CHANGED=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED="$(git diff --name-only "$BEFORE" "$SHA" || true)"
          fi

          declare -A DEPLOY_ROOTS=()
          ONLY_META=1
          if [ -n "$CHANGED" ]; then
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                .github/*|.deploy-exclude|.gitignore|DEPLOY.md|GITHUB-SETUP.md|phantom_dashboard.secrets.cfg|mysql.cfg)
                  continue
                  ;;
              esac
              ONLY_META=0
              add_changed_file "$file"
            done <<< "$CHANGED"
          fi

          if [ "$ONLY_META" -eq 1 ] || [ "${#DEPLOY_ROOTS[@]}" -eq 0 ]; then
            if [ -z "$CHANGED" ]; then
              echo "Deploy mode: full server sync (first push or unknown base)"
            else
              echo "Deploy mode: skipped — only workflow/docs changed, nothing to upload"
              echo "DEPLOY_MODE=skip" >> "$GITHUB_ENV"
              exit 0
            fi
            echo "DEPLOY_MODE=full" >> "$GITHUB_ENV"
            rsync -av --exclude-from=.deploy-exclude ./ "$BUNDLE_DIR"/
            exit 0
          fi

          echo "Deploy mode: changed files only (${#DEPLOY_ROOTS[@]} target(s))"
          echo "DEPLOY_MODE=scoped" >> "$GITHUB_ENV"
          for root in "${!DEPLOY_ROOTS[@]}"; do
            case "$root" in
              __file__:*)
                copy_path "${root#__file__:}"
                ;;
              *)
                copy_path "$root"
                ;;
            esac
          done

      - name: Sync to server via SFTP
        if: env.DEPLOY_MODE != 'skip'
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        timeout-minutes: 120
        run: |
          set -euo pipefail

          : "${SFTP_HOST:?SFTP_HOST secret is required}"
          : "${SFTP_USER:?SFTP_USER secret is required}"
          : "${SFTP_PASSWORD:?SFTP_PASSWORD secret is required}"

          PORT="${SFTP_PORT:-2022}"
          REMOTE_PATH="${SFTP_PATH:-.}"
          if [ "$REMOTE_PATH" != "/" ]; then
            REMOTE_PATH="${REMOTE_PATH%/}"
          fi
          if [ -z "$REMOTE_PATH" ]; then
            REMOTE_PATH="."
          fi
          if [ "$REMOTE_PATH" = "/home/container" ]; then
            echo "Using SFTP login root for Pterodactyl-style /home/container path"
            REMOTE_PATH="."
          fi

          : "${BUNDLE_DIR:?BUNDLE_DIR was not created}"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "Deploy bundle directory does not exist: $BUNDLE_DIR"
            exit 1
          fi

          FILE_COUNT="$(find "$BUNDLE_DIR" -type f | wc -l | tr -d ' ')"
          echo "Uploading $FILE_COUNT file(s) via SFTP (${DEPLOY_MODE:-unknown} mode)"

          BATCH=""
          trap 'rm -rf "$BUNDLE_DIR"; if [ -n "$BATCH" ]; then rm -f "$BATCH"; fi' EXIT

          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          BATCH="$(mktemp)"
          {
            printf 'lcd "%s"\n' "$BUNDLE_DIR"
            printf 'cd "%s"\n' "$REMOTE_PATH"
            (
              cd "$BUNDLE_DIR"
              shopt -s nullglob
              for item in *; do
                if [ -d "$item" ]; then
                  printf 'put -r "%s"\n' "$item"
                else
                  printf 'put "%s"\n' "$item"
                fi
              done
            )
          } > "$BATCH"

          export SSHPASS="$SFTP_PASSWORD"
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=no \
            -P "$PORT" -b "$BATCH" "${SFTP_USER}@${SFTP_HOST}"

          echo "SFTP upload complete"

      - name: Restart game server
        if: env.DEPLOY_MODE != 'skip'
        continue-on-error: true
        env:
          PTERODACTYL_PANEL_URL: ${{ secrets.PTERODACTYL_PANEL_URL }}
          PTERODACTYL_CLIENT_API_KEY: ${{ secrets.PTERODACTYL_CLIENT_API_KEY }}
          PTERODACTYL_SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
        run: |
          set -euo pipefail

          if [ -z "${PTERODACTYL_CLIENT_API_KEY:-}" ] || [ -z "${PTERODACTYL_SERVER_ID:-}" ] || [ -z "${PTERODACTYL_PANEL_URL:-}" ]; then
            echo "::warning::Restart skipped. Add PTERODACTYL_PANEL_URL, PTERODACTYL_CLIENT_API_KEY, and PTERODACTYL_SERVER_ID to GitHub Actions secrets to restart after each deploy."
            exit 0
          fi

          PANEL="${PTERODACTYL_PANEL_URL%/}"
          RESPONSE="$(mktemp)"
          trap 'rm -f "$RESPONSE"' EXIT

          HTTP_CODE="$(curl -sS -o "$RESPONSE" -w '%{http_code}' -X POST \
            "${PANEL}/api/client/servers/${PTERODACTYL_SERVER_ID}/power" \
            -H "Authorization: Bearer ${PTERODACTYL_CLIENT_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" \
            -H "User-Agent: phantomworld-github-deploy/1.0" \
            -d '{"signal":"restart"}')"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Server restart signal sent (HTTP ${HTTP_CODE})."
            exit 0
          fi

          if [ "$HTTP_CODE" = "403" ] && grep -qiE 'just a moment|challenges\.cloudflare\.com|cf-chl' "$RESPONSE"; then
            echo "::warning::Restart blocked by Cloudflare on ${PANEL} (HTTP 403). SFTP deploy succeeded — restart the server manually from the Gravelhost panel."
            echo "GitHub Actions cannot pass Cloudflare browser checks. Ask Gravelhost to allowlist CI/API access, or restart by hand after each deploy."
            exit 0
          fi

          echo "::warning::Restart request failed (HTTP ${HTTP_CODE}). SFTP deploy succeeded — restart manually from the panel if needed."
          head -c 500 "$RESPONSE" || true
          echo ""
          exit 0
