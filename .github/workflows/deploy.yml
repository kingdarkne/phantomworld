name: Deploy to FiveM host

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          mkdir -p deploy_bundle
          rsync -av --exclude-from=.deploy-exclude ./ deploy_bundle/

      - name: Sync to server via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          username: ${{ secrets.SFTP_USER }}
          server: ${{ secrets.SFTP_HOST }}
          port: ${{ secrets.SFTP_PORT || '22' }}
          password: ${{ secrets.SFTP_PASSWORD }}
          ssh_private_key: ''
          local_path: './deploy_bundle/'
          remote_path: ${{ secrets.SFTP_PATH || '/home/container' }}
          sftp_only: true
          sftpArgs: '-o ConnectTimeout=30 -o StrictHostKeyChecking=no'
