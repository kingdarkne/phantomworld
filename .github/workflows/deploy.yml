name: Deploy to FiveM host

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          mkdir -p deploy_bundle
          rsync -av --exclude-from=.deploy-exclude ./ deploy_bundle/

      - name: Sync to server via SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USER }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: ${{ secrets.SFTP_PORT || 22 }}
          protocol: sftp
          local-dir: deploy_bundle/
          server-dir: ${{ secrets.SFTP_PATH || '/home/container/' }}
          timeout: 120000
          log-level: verbose
          dangerous-clean-slate: false
