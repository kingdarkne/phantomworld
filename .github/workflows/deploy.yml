name: Deploy to FiveM host

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          mkdir -p deploy_bundle
          rsync -av --exclude-from=.deploy-exclude ./ deploy_bundle/

      - name: Install SFTP tools
        run: sudo apt-get update && sudo apt-get install -y lftp sshpass

      - name: Sync to server via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        timeout-minutes: 55
        run: |
          set -euo pipefail

          : "${SFTP_HOST:?SFTP_HOST secret is required}"
          : "${SFTP_USER:?SFTP_USER secret is required}"
          : "${SFTP_PASSWORD:?SFTP_PASSWORD secret is required}"

          PORT="${SFTP_PORT:-2022}"
          REMOTE_PATH="${SFTP_PATH:-/home/container}"
          REMOTE_PATH="${REMOTE_PATH%/}"

          export SSHPASS="$SFTP_PASSWORD"

          lftp -c "
          set cmd:fail-exit yes;
          set net:timeout 30;
          set net:max-retries 2;
          set net:reconnect-interval-base 5;
          set sftp:connect-program 'sshpass -e ssh -a -x -o BatchMode=no -o StrictHostKeyChecking=no -p ${PORT}';
          open -u ${SFTP_USER} sftp://${SFTP_HOST};
          ls ${REMOTE_PATH};
          mirror -R --verbose --parallel=4 deploy_bundle/ ${REMOTE_PATH}/;
          bye
          "
