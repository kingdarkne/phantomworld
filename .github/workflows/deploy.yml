name: Deploy to FiveM host

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          mkdir -p deploy_bundle
          rsync -av --exclude-from=.deploy-exclude ./ deploy_bundle/

      - name: Install lftp and sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp sshpass

      - name: Sync to server via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT || '22' }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PATH: ${{ secrets.SFTP_PATH || '/home/container' }}
          # sshpass reads password from SSHPASS; avoids shell word-splitting on @, $, etc.
          SSHPASS: ${{ secrets.SFTP_PASSWORD }}
        run: |
          set -euo pipefail
          lftp -e "
            set sftp:connect-program \"sshpass -e ssh -a -x -o StrictHostKeyChecking=no -o ConnectTimeout=30\";
            open sftp://${SFTP_USER}@${SFTP_HOST}:${SFTP_PORT};
            mirror -R --verbose --parallel=4 deploy_bundle/ ${SFTP_PATH}/;
            quit
          "
