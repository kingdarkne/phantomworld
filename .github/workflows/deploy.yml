name: Deploy to FiveM host

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          BUNDLE_DIR="$(mktemp -d)"
          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"
          rsync -av --exclude-from=.deploy-exclude ./ "$BUNDLE_DIR"/

      - name: Sync to server via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        timeout-minutes: 120
        run: |
          set -euo pipefail
          trap 'rm -rf "${BUNDLE_DIR:-}" "${BATCH:-}"' EXIT

          : "${SFTP_HOST:?SFTP_HOST secret is required}"
          : "${SFTP_USER:?SFTP_USER secret is required}"
          : "${SFTP_PASSWORD:?SFTP_PASSWORD secret is required}"
          : "${BUNDLE_DIR:?BUNDLE_DIR is required}"

          PORT="${SFTP_PORT:-2022}"
          REMOTE_PATH="${SFTP_PATH:-/home/container}"
          REMOTE_PATH="${REMOTE_PATH%/}"

          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          BATCH="$(mktemp)"
          {
            printf 'lcd "%s"\n' "$BUNDLE_DIR"
            echo "cd ${REMOTE_PATH}"
            (
              cd "$BUNDLE_DIR"
              shopt -s nullglob
              for item in *; do
                if [ -d "$item" ]; then
                  printf 'put -r "%s"\n' "$item"
                else
                  printf 'put "%s"\n' "$item"
                fi
              done
            )
          } > "$BATCH"

          export SSHPASS="$SFTP_PASSWORD"
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=no \
            -P "$PORT" -b "$BATCH" "${SFTP_USER}@${SFTP_HOST}"

          echo "SFTP upload complete"
