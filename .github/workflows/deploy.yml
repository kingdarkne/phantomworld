name: Deploy to FiveM host

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Prepare deploy bundle
        run: |
          set -euo pipefail
          BUNDLE_DIR="$(mktemp -d)"
          echo "BUNDLE_DIR=$BUNDLE_DIR" >> "$GITHUB_ENV"
          rsync -av --exclude-from=.deploy-exclude ./ "$BUNDLE_DIR"/

      - name: Sync to server via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        timeout-minutes: 120
        run: |
          set -euo pipefail

          : "${SFTP_HOST:?SFTP_HOST secret is required}"
          : "${SFTP_USER:?SFTP_USER secret is required}"
          : "${SFTP_PASSWORD:?SFTP_PASSWORD secret is required}"

          PORT="${SFTP_PORT:-2022}"
          REMOTE_PATH="${SFTP_PATH:-.}"
          if [ "$REMOTE_PATH" != "/" ]; then
            REMOTE_PATH="${REMOTE_PATH%/}"
          fi
          if [ -z "$REMOTE_PATH" ]; then
            REMOTE_PATH="."
          fi
          if [ "$REMOTE_PATH" = "/home/container" ]; then
            echo "Using SFTP login root for Pterodactyl-style /home/container path"
            REMOTE_PATH="."
          fi

          : "${BUNDLE_DIR:?BUNDLE_DIR was not created}"
          if [ ! -d "$BUNDLE_DIR" ]; then
            echo "Deploy bundle directory does not exist: $BUNDLE_DIR"
            exit 1
          fi
          BATCH=""
          trap 'rm -rf "$BUNDLE_DIR"; if [ -n "$BATCH" ]; then rm -f "$BATCH"; fi' EXIT

          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

          BATCH="$(mktemp)"
          {
            printf 'lcd "%s"\n' "$BUNDLE_DIR"
            printf 'cd "%s"\n' "$REMOTE_PATH"
            (
              cd "$BUNDLE_DIR"
              shopt -s nullglob
              for item in *; do
                if [ -d "$item" ]; then
                  printf 'put -r "%s"\n' "$item"
                else
                  printf 'put "%s"\n' "$item"
                fi
              done
            )
          } > "$BATCH"

          export SSHPASS="$SFTP_PASSWORD"
          sshpass -e sftp -oBatchMode=no -oStrictHostKeyChecking=no \
            -P "$PORT" -b "$BATCH" "${SFTP_USER}@${SFTP_HOST}"

          echo "SFTP upload complete"

      - name: Restart game server
        env:
          PTERODACTYL_PANEL_URL: ${{ secrets.PTERODACTYL_PANEL_URL }}
          PTERODACTYL_CLIENT_API_KEY: ${{ secrets.PTERODACTYL_CLIENT_API_KEY }}
          PTERODACTYL_SERVER_ID: ${{ secrets.PTERODACTYL_SERVER_ID }}
        run: |
          set -euo pipefail

          if [ -z "${PTERODACTYL_CLIENT_API_KEY:-}" ] || [ -z "${PTERODACTYL_SERVER_ID:-}" ] || [ -z "${PTERODACTYL_PANEL_URL:-}" ]; then
            echo "::warning::Restart skipped. Add PTERODACTYL_PANEL_URL, PTERODACTYL_CLIENT_API_KEY, and PTERODACTYL_SERVER_ID to GitHub Actions secrets to restart after each deploy."
            exit 0
          fi

          PANEL="${PTERODACTYL_PANEL_URL%/}"
          RESPONSE="$(mktemp)"
          trap 'rm -f "$RESPONSE"' EXIT

          HTTP_CODE="$(curl -sS -o "$RESPONSE" -w '%{http_code}' -X POST \
            "${PANEL}/api/client/servers/${PTERODACTYL_SERVER_ID}/power" \
            -H "Authorization: Bearer ${PTERODACTYL_CLIENT_API_KEY}" \
            -H "Content-Type: application/json" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" \
            -d '{"signal":"restart"}')"

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            echo "Server restart signal sent (HTTP ${HTTP_CODE})."
          else
            echo "Restart request failed (HTTP ${HTTP_CODE}):"
            cat "$RESPONSE"
            exit 1
          fi
