  <rect width="1080" height="3740" fill="url(#glowPurple)"/>
  <rect width="1080" height="3740" fill="url(#glowBlue)"/>

  <rect x="54" y="54" width="972" height="3632" rx="34" fill="#0b1224" fill-opacity="0.72" stroke="url(#panelStroke)" stroke-width="2" filter="url(#shadow)"/>

  <rect x="86" y="92" width="220" height="42" rx="21" fill="#8b5cf6" fill-opacity="0.18" stroke="#a78bfa" stroke-opacity="0.55"/>
