  <text x="86" y="205" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="72" font-weight="800" letter-spacing="1">PHANTOM WORLD RP</text>
  <text x="86" y="255" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">Serious FiveM roleplay with custom systems, dynamic events,</text>
  <text x="86" y="295" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="500">balanced gameplay, and an active community.</text>

