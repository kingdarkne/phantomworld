  <text x="126" y="438" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">discord.gg/TYtFPCzu</text>
  <text x="994" y="438" text-anchor="end" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="500">Join Discord for the server invite</text>

  <rect x="86" y="505" width="908" height="230" rx="28" fill="#111827" fill-opacity="0.9" stroke="#8b5cf6" stroke-opacity="0.45"/>
  <text x="122" y="555" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">ABOUT OUR SERVER</text>
  <text x="122" y="607" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="26" font-weight="600">Phantom World RP is an immersive FiveM roleplay experience</text>
  <text x="122" y="645" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="25">built with attention to detail and player enjoyment in mind.</text>
  <text x="122" y="683" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="25">We offer a balanced economy, custom systems, and a welcoming</text>
  <text x="122" y="721" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="25">community for all roleplayers.</text>

  <text x="122" y="790" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="2">UNIQUE FEATURES</text>

  <rect x="86" y="820" width="908" height="280" rx="28" fill="#111827" fill-opacity="0.9" stroke="#8b5cf6" stroke-opacity="0.45"/>
  <text x="122" y="870" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">CUSTOM HUD</text>
  <text x="122" y="922" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Beautiful, modern HUD with real-time information display</text>
  <text x="122" y="958" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Shows cash, bank, rank, job, gang, and street location</text>
  <text x="122" y="994" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Built-in fuel gauge for vehicles</text>
  <text x="122" y="1030" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Automatically hides during pause menu and other UIs</text>
  <text x="122" y="1066" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Positioned for optimal visibility without obstructing gameplay</text>

  <rect x="86" y="1140" width="908" height="485" rx="28" fill="#111827" fill-opacity="0.9" stroke="#22d3ee" stroke-opacity="0.45"/>
  <text x="122" y="1190" fill="#a5f3fc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">DYNAMIC WORLD EVENTS</text>
  <text x="122" y="1242" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600">Earthquakes - Screen shake and explosive tremors</text>
  <text x="122" y="1278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Lightning Storms - Dynamic lighting with thunder sounds</text>
  <text x="122" y="1314" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Acid Rain - Dangerous weather that damages vehicles</text>
  <text x="122" y="1350" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Heat Waves - Extreme temperatures affecting engines</text>
  <text x="122" y="1386" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Sandstorms, Fog, and Blackouts - Challenging weather conditions</text>
  <text x="122" y="1422" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Meteor Showers, Tornadoes, and EMPs - Catastrophic events</text>
  <text x="122" y="1458" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Gravity Anomalies, Slow Motion, and High Gravity - Physics-altering phenomena</text>
  <text x="122" y="1494" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="22">Vehicle Chaos and Police Pursuits - Action-packed scenarios</text>
  <text x="122" y="1554" fill="#67e8f9" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="700">All events feature visual effects, camera shake, and affect NPCs.</text>

  <rect x="86" y="1665" width="908" height="230" rx="28" fill="#111827" fill-opacity="0.9" stroke="#8b5cf6" stroke-opacity="0.45"/>
  <text x="122" y="1715" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">VEHICLE SYSTEMS</text>
  <text x="122" y="1767" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Enhanced Vehicle Durability - Vehicles are tougher and more realistic</text>
  <text x="122" y="1803" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Renzu Customs - Full vehicle customization shop</text>
  <text x="122" y="1839" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Realistic fuel system</text>
  <text x="122" y="1875" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Balanced vehicle damage mechanics</text>

  <rect x="86" y="1935" width="908" height="190" rx="28" fill="#111827" fill-opacity="0.9" stroke="#22d3ee" stroke-opacity="0.45"/>
