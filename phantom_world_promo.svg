  <text x="122" y="2533" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Regular Updates - Active Development</text>

  <rect x="86" y="2625" width="908" height="290" rx="28" fill="#111827" fill-opacity="0.9" stroke="#a78bfa" stroke-opacity="0.4"/>
  <text x="122" y="2675" fill="#f5d0fe" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">SERVER RULES</text>
  <text x="122" y="2727" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">1. Respect all players - No toxicity or harassment</text>
  <text x="122" y="2763" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">2. Stay in character - Serious RP in designated areas</text>
  <text x="122" y="2799" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">3. No exploiting - Report bugs and do not abuse them</text>
  <text x="122" y="2835" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">4. Follow Discord rules - Our Discord TOS applies</text>
  <text x="122" y="2871" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">5. Have fun - We are here to enjoy RP together</text>

  <rect x="86" y="2955" width="908" height="200" rx="28" fill="#111827" fill-opacity="0.9" stroke="#22d3ee" stroke-opacity="0.45"/>
  <text x="122" y="3005" fill="#a5f3fc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">JOIN US TODAY</text>
  <text x="122" y="3057" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Discord: https://discord.gg/TYtFPCzu</text>
  <text x="122" y="3093" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Server IP: Join Discord for server invite</text>
  <text x="122" y="3129" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Website: Coming soon</text>

  <rect x="86" y="3195" width="908" height="270" rx="28" fill="#111827" fill-opacity="0.9" stroke="#8b5cf6" stroke-opacity="0.45"/>
  <text x="122" y="3245" fill="#e9d5ff" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="800" letter-spacing="2">WHY CHOOSE PHANTOM WORLD RP</text>
  <text x="122" y="3297" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="600">Active Staff Team - Our admins are fair and responsive</text>
  <text x="122" y="3333" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Custom Scripts - Unique features you will not find elsewhere</text>
  <text x="122" y="3369" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Balanced Gameplay - No pay-to-win, skill-based progression</text>
  <text x="122" y="3405" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Community Focused - We listen to player feedback</text>
  <text x="122" y="3441" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Regular Events - Community events and server-wide activities</text>

  <rect x="86" y="3505" width="908" height="150" rx="28" fill="#0f172a" fill-opacity="0.92" stroke="#22d3ee" stroke-opacity="0.45"/>
  <text x="540" y="3560" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="800">PHANTOM WORLD RP - WHERE YOUR STORY BEGINS</text>
  <text x="540" y="3604" text-anchor="middle" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="500">Ready to start your journey? Connect now and become part of our growing community.</text>
