  <text x="122" y="2303" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Multiple income sources</text>
  <text x="122" y="2339" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Job-based progression</text>

