  <text x="122" y="2037" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">Ono Awesome Admins - Comprehensive admin panel</text>
  <text x="122" y="2073" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Easy access to moderation tools</text>
  <text x="122" y="2109" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="23">Player management capabilities</text>

