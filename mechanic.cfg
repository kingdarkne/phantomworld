# =============================================================================
# Phantom World — mechanic shops (kaves_mechanic + phantom_mechanic)
# =============================================================================
# Exec from server.cfg after ox_lib, ox_target, ox_compat, and qbx_core.
# Re-exec near the end of server.cfg so renzu/qbx customs stay stopped.
#
# JOB RULE (in-resource config):
#   - Player mechanics: job name `mechanic` (on duty) — tuning menu, tablet, boss menu
#   - Staff/admin duty job `duty` does NOT grant mechanic shop access
#   - Customers (any job): ox_target "Place Custom Order" while in a vehicle at the shop
#
# Resources:
#   kaves_mechanic   = LSC / Benny's vehicle tuning (ox_target + markers)
#   phantom_mechanic = custom orders + F6 tablet for mechanics
#   renzu_customs    = STOPPED
#   qbx_customs      = STOPPED
# =============================================================================

####################
### Resources    ###
####################

ensure kaves_mechanic
ensure phantom_mechanic
stop renzu_customs
stop qbx_customs

###################
### Late stops  ###
###################

stop renzu_customs
stop qbx_customs
