<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="call" class="hidden">
    <div class="phone">
      <div class="pulse"></div>
      <div class="caller" id="name">Unknown</div>
      <div class="title" id="title">Incoming contract</div>
      <div class="blurb" id="blurb"></div>
      <div class="actions">
        <button id="decline" class="btn decline">Decline</button>
        <button id="accept" class="btn accept">Accept</button>
      </div>
      <div class="timer" id="timer"></div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
