<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Weapons</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Weapon Wheel -->
    <div id="weaponWheel" class="hidden">
        <div class="wheel-container">
            <div class="wheel-background"></div>
            <div class="wheel-slots" id="wheelSlots">
                <!-- Slots generated by JS -->
            </div>
            <div class="wheel-center">
                <div class="selected-weapon" id="selectedWeapon">🔫</div>
                <div class="selected-name" id="selectedName">PISTOL</div>
                <div class="selected-ammo" id="selectedAmmo">AMMO: --</div>
            </div>
        </div>
    </div>

    <!-- Ammu-Nation Store -->
    <div id="ammuNation" class="hidden">
        <div class="store-overlay">
            <div class="store-panel">
                <div class="store-header">
                    <div class="store-brand">
                        <div class="brand-icon">🔫</div>
                        <div class="brand-text">
                            <h1>AMMU-NATION</h1>
                            <span>PROTECTING YOUR RIGHTS</span>
                        </div>
                    </div>
                    <div class="player-cash">
                        <span class="cash-label">CASH</span>
                        <span class="cash-value" id="playerCash">$50,000</span>
                    </div>
                    <button class="close-btn" id="closeStore">✕</button>
                </div>

                <div class="store-content">
                    <!-- Category Tabs -->
                    <div class="category-tabs">
                        <button class="tab active" data-category="melee">MELEE</button>
                        <button class="tab" data-category="handguns">HANDGUNS</button>
                        <button class="tab" data-category="smg">SMG</button>
                        <button class="tab" data-category="rifles">RIFLES</button>
                        <button class="tab" data-category="shotguns">SHOTGUNS</button>
                        <button class="tab" data-category="heavy">HEAVY</button>
                    </div>

                    <!-- Weapons Grid -->
                    <div class="weapons-grid" id="weaponsGrid">
                        <!-- Generated by JS -->
                    </div>

                    <!-- Weapon Detail Panel -->
                    <div class="weapon-detail" id="weaponDetail">
                        <div class="detail-image" id="detailImage">🔫</div>
                        <div class="detail-info">
                            <h2 id="detailName">WEAPON NAME</h2>
                            <p class="detail-desc" id="detailDesc">Weapon description goes here.</p>
                            <div class="detail-stats">
                                <div class="stat-bar">
                                    <span>DAMAGE</span>
                                    <div class="bar"><div class="fill" id="damageBar"></div></div>
                                </div>
                                <div class="stat-bar">
                                    <span>FIRE RATE</span>
                                    <div class="bar"><div class="fill" id="fireRateBar"></div></div>
                                </div>
                                <div class="stat-bar">
                                    <span>ACCURACY</span>
                                    <div class="bar"><div class="fill" id="accuracyBar"></div></div>
                                </div>
                                <div class="stat-bar">
                                    <span>RANGE</span>
                                    <div class="bar"><div class="fill" id="rangeBar"></div></div>
                                </div>
                            </div>
                            <div class="detail-price" id="detailPrice">$1,000</div>
                            <button class="btn-buy" id="btnBuyWeapon">BUY WEAPON</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
