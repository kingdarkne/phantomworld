<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Events</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Big Announcement Overlay -->
    <div id="bigAnnouncement" class="announcement-container hidden">
        <div class="announcement-backdrop"></div>
        <div class="announcement-content">
            <div class="announcement-icon" id="announceIcon">🎉</div>
            <h1 class="announcement-title" id="announceTitle">EVENT STARTED</h1>
            <p class="announcement-desc" id="announceDesc">Description here</p>
            <div class="announcement-timer" id="announceTimer">00:00</div>
            <div class="announcement-bar">
                <div class="bar-fill" id="barFill"></div>
            </div>
        </div>
    </div>

    <!-- Event Ended Overlay -->
    <div id="eventEnded" class="announcement-container ended hidden">
        <div class="announcement-backdrop"></div>
        <div class="announcement-content">
            <div class="announcement-icon">🏁</div>
            <h1 class="announcement-title">EVENT ENDED</h1>
            <p class="announcement-desc" id="endedDesc">Thanks for playing!</p>
        </div>
    </div>

    <!-- Admin Panel -->
    <div id="adminPanel" class="admin-container hidden">
        <div class="admin-backdrop"></div>
        <div class="admin-panel">
            <div class="admin-header">
                <h1>⚡ EVENT CONTROLLER</h1>
                <button class="close-btn" id="closeAdmin">✕</button>
            </div>
            <div class="admin-grid" id="eventGrid">
                <!-- Event cards generated by JS -->
            </div>
            <div class="admin-footer">
                <div class="active-events" id="activeEvents">
                    <span class="label">Active Events:</span>
                    <span class="count" id="activeCount">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Lottery Winner -->
    <div id="lotteryWinner" class="announcement-container winner hidden">
        <div class="announcement-backdrop"></div>
        <div class="announcement-content">
            <div class="confetti">🎊</div>
            <h1 class="announcement-title">LOTTERY WINNER!</h1>
            <div class="winner-name" id="winnerName">Player Name</div>
            <div class="winner-prize" id="winnerPrize">$100,000</div>
            <div class="winner-tickets" id="winnerTickets">100 tickets sold</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
