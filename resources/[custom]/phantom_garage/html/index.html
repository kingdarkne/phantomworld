<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom Garage</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div id="garageUI" class="hidden">
        <div class="garage-overlay">
            <div class="garage-panel">
                <!-- Header -->
                <div class="garage-header">
                    <div class="garage-title">
                        <div class="garage-icon">🏢</div>
                        <div class="garage-info">
                            <h1 id="garageName">GARAGE</h1>
                            <span id="garageType">10-Car Garage</span>
                        </div>
                    </div>
                    <div class="garage-stats">
                        <div class="stat">
                            <span class="stat-value" id="vehicleCount">0</span>
                            <span class="stat-label">/ <span id="maxSlots">10</span> VEHICLES</span>
                        </div>
                    </div>
                    <button class="close-btn" id="closeGarage">✕</button>
                </div>

                <!-- Vehicle Grid -->
                <div class="garage-content">
                    <div class="vehicle-grid" id="vehicleGrid">
                        <!-- Vehicle cards generated by JS -->
                    </div>

                    <!-- Selected Vehicle Panel -->
                    <div class="vehicle-detail hidden" id="vehicleDetail">
                        <div class="detail-preview">
                            <div class="preview-car" id="previewCar">🚗</div>
                            <div class="preview-name" id="detailName">Vehicle Name</div>
                            <div class="preview-class" id="detailClass">Sports</div>
                        </div>
                        <div class="detail-stats">
                            <div class="detail-stat">
                                <span class="label">Speed</span>
                                <div class="bar"><div class="fill" id="speedBar" style="width: 80%"></div></div>
                            </div>
                            <div class="detail-stat">
                                <span class="label">Acceleration</span>
                                <div class="bar"><div class="fill" id="accelBar" style="width: 70%"></div></div>
                            </div>
                            <div class="detail-stat">
                                <span class="label">Braking</span>
                                <div class="bar"><div class="fill" id="brakeBar" style="width: 60%"></div></div>
                            </div>
                            <div class="detail-stat">
                                <span class="label">Handling</span>
                                <div class="bar"><div class="fill" id="handlingBar" style="width: 75%"></div></div>
                            </div>
                        </div>
                        <div class="detail-actions">
                            <button class="btn btn-drive" id="btnDrive">🚗 DRIVE</button>
                            <button class="btn btn-sell" id="btnSell">💰 SELL</button>
                            <button class="btn btn-insurance" id="btnInsurance">🔧 CLAIM</button>
                        </div>
                    </div>
                </div>

                <!-- Empty Slot Message -->
                <div class="empty-message hidden" id="emptyMessage">
                    <div class="empty-icon">🚗</div>
                    <p>No vehicles stored in this garage</p>
                    <button class="btn btn-buy" id="btnBuyVehicle">BROWSE DEALERSHIP</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
