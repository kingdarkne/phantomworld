<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Phantom World Main Menu</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="root" class="hidden">
      <div class="menu-container">
        <div class="menu-header">
          <h1>PHANTOM MENU</h1>
          <p>Cars • Jobs • Membership</p>
        </div>

        <div class="menu-sections">
          <div class="section">
            <h2>Vehicles</h2>
            <button data-action="vehicles_openGarage">Open Garage</button>
            <button data-action="vehicles_returnCurrent">Return Current Vehicle</button>
          </div>

          <div class="section">
            <h2>Jobs</h2>
            <div class="jobs-grid">
              <button data-action="jobs_set" data-job="unemployed">Unemployed</button>
              <button data-action="jobs_set" data-job="trucker">Trucker</button>
              <button data-action="jobs_set" data-job="garbage">Garbage</button>
              <button data-action="jobs_set" data-job="tow">Tow</button>
              <button data-action="jobs_set" data-job="taxi">Taxi</button>
              <button data-action="jobs_set" data-job="security">Security</button>
            </div>
          </div>

          <div class="section">
            <h2>Membership</h2>
            <p>View your tier, coins and remaining free trial.</p>
            <button data-action="membership_open">Open Membership Info</button>
          </div>

          <div class="section">
            <h2>Admin</h2>
            <p>Staff only. Opens EasyAdmin if your identifiers have the right ACE permissions.</p>
            <button data-action="admin_open">Open EasyAdmin</button>
          </div>
        </div>

        <div class="menu-footer">
          <span>Press F10 again or ESC to close</span>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
  </html>
