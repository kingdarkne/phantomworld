<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phantom World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="sky" id="sky" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <main class="stage">
    <header class="brand-block">
      <img class="mascot" src="img/logo.png" alt="Phantom World" />
      <h1 class="brand" id="brand">Phantom World</h1>
      <p class="tagline" id="tagline">Jump in. Drive. Hustle. Have fun.</p>
      <p class="welcome" id="welcome">A freeroam-first Los Santos — jobs on demand, phone contracts, and zero gatekeeping.</p>
    </header>

    <div class="cta-row" id="cta-row">
      <a class="cta discord" id="cta-discord" href="#" data-url="">
        <span class="cta-kicker">Community</span>
        <span class="cta-main" id="discord-label">Discord</span>
      </a>
      <a class="cta join" id="cta-join" href="#" data-url="">
        <span class="cta-kicker">Connect</span>
        <span class="cta-main" id="cfx-label">CFX Join</span>
      </a>
    </div>

    <footer class="dock">
      <p class="tip" id="tip"></p>
      <div class="progress-wrap">
        <div class="progress-meta">
          <span id="status">Warming up the city…</span>
          <span id="pct">0%</span>
        </div>
        <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="bar-fill" id="bar-fill"></div>
          <div class="bar-glow" id="bar-glow"></div>
        </div>
      </div>
      <div class="dock-actions">
        <button type="button" class="music-btn" id="music-btn" aria-label="Toggle music">Music · On</button>
        <span class="host" id="host"></span>
      </div>
    </footer>
  </main>

  <audio id="bgm" preload="auto" loop></audio>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
