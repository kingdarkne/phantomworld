<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phantom World Tips</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }
        
        #tip-container {
            position: fixed;
            padding: 20px 30px;
            border-radius: 10px;
            max-width: 500px;
            z-index: 9999;
            display: none;
            animation: slideIn 0.5s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .tip-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .tip-text {
            font-size: 16px;
            line-height: 1.5;
        }
        
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            cursor: pointer;
            font-size: 20px;
            opacity: 0.7;
        }
        
        .close-btn:hover {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="tip-container">
        <span class="close-btn" onclick="closeTip()">×</span>
        <div class="tip-title"></div>
        <div class="tip-text"></div>
    </div>
    
    <script>
        let tipTimeout;
        
        window.addEventListener('message', function(event) {
            const data = event.data;
            
            if (data.action === 'showTip') {
                showTip(data);
            } else if (data.action === 'keepalive') {
                // Keep NUI alive
            }
        });
        
        function showTip(data) {
            const container = document.getElementById('tip-container');
            const title = container.querySelector('.tip-title');
            const text = container.querySelector('.tip-text');
            
            title.textContent = data.title;
            text.textContent = data.tip;
            container.style.backgroundColor = data.backgroundColor;
            title.style.color = data.titleColor;
            text.style.color = data.textColor;
            text.style.fontSize = data.fontSize + 'px';
            
            // Position
            switch(data.position) {
                case 'top':
                    container.style.top = '20px';
                    container.style.left = '50%';
                    container.style.transform = 'translateX(-50%)';
                    container.style.bottom = 'auto';
                    container.style.right = 'auto';
                    break;
                case 'bottom':
                    container.style.bottom = '20px';
                    container.style.left = '50%';
                    container.style.transform = 'translateX(-50%)';
                    container.style.top = 'auto';
                    container.style.right = 'auto';
                    break;
                case 'left':
                    container.style.left = '20px';
                    container.style.top = '50%';
                    container.style.transform = 'translateY(-50%)';
                    container.style.bottom = 'auto';
                    container.style.right = 'auto';
                    break;
                case 'right':
                    container.style.right = '20px';
                    container.style.top = '50%';
                    container.style.transform = 'translateY(-50%)';
                    container.style.bottom = 'auto';
                    container.style.left = 'auto';
                    break;
            }
            
            container.style.display = 'block';
            
            // Auto hide
            if (tipTimeout) {
                clearTimeout(tipTimeout);
            }
            
            tipTimeout = setTimeout(function() {
                container.style.display = 'none';
            }, data.duration);
        }
        
        function closeTip() {
            const container = document.getElementById('tip-container');
            container.style.display = 'none';
            
            if (tipTimeout) {
                clearTimeout(tipTimeout);
            }
            
            fetch(`https://${GetParentResourceName()}/closeTip`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({})
            });
        }
    </script>
</body>
</html>
